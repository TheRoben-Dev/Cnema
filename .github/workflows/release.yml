name: Release

# Two ways to cut a release:
#   - Actions tab -> Release -> Run workflow, with a version like 0.2.0 (creates the tag for you)
#   - push a tag like v0.2.0
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, without the leading v (e.g. 0.2.0)
        required: true
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ inputs.version || github.ref_name }}

  release:
    needs: package
    runs-on: ubuntu-latest
    env:
      RAW_VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Resolve tag
        run: echo "TAG=v${RAW_VERSION#v}" >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Cnema ${{ env.TAG }}
          generate_release_notes: true
          files: |
            Cnema-*.zip
            Cnema-*.tar.gz
