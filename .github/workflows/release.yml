name: Release

# Two ways to cut a release:
#   - Actions tab -> Release -> Run workflow, with a version like 0.2.0 (creates the tag for you)
#   - push a tag like v0.2.0
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, without the leading v (e.g. 0.2.0)
        required: true
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ inputs.version || github.ref_name }}

  release:
    needs: package
    runs-on: ubuntu-latest
    env:
      RAW_VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Resolve tag
        run: echo "TAG=v${RAW_VERSION#v}" >> "$GITHUB_ENV"
      # The release notes are this version's section of CHANGELOG.md, the same text the app shows.
      - name: Release notes
        run: |
          awk -v v="${TAG#v}" '$0 == "## " v {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Savefile $TAG." > notes.md
          printf '\n**Installing:** macOS: unzip, move Cnema.app to Applications, then right-click and Open the first time (the app file keeps its old name for now so updates keep working; it shows as Savefile). Windows: unzip and run Cnema.exe. Linux: needs libvlc5, vlc-plugin-base and ffmpeg from your distribution. Savefile (formerly Cnema) installs later versions by itself.\n' >> notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Savefile ${{ env.TAG }}
          body_path: notes.md
          files: |
            Savefile-*.zip
            Savefile-*.tar.gz
      # The source repository is private, so its releases are invisible to the app's update check
      # and to anyone downloading. The same builds are published to a public, releases-only repository.
      # Needs the secret RELEASES_TOKEN: a fine-grained token with Contents read/write on that repo only.
      - name: Publish to the public releases repository
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          PUBLIC_REPO: TheRoben-Dev/Cnema-releases
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::RELEASES_TOKEN is not set; skipped publishing to $PUBLIC_REPO"
            exit 0
          fi
          gh release create "$TAG" Savefile-*.zip Savefile-*.tar.gz --repo "$PUBLIC_REPO" \
            --title "Savefile $TAG" \
            --notes-file notes.md
