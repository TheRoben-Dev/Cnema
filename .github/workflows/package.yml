name: Package

# Builds the downloadable archives for every platform. Called by release.yml, and by build.yml on
# pull requests so packaging problems show up before a release is cut.
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: osx-arm64
            os: macos-latest
          - rid: osx-x64
            os: macos-latest
          - rid: win-x64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    env:
      RAW_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Package
        shell: bash
        run: scripts/package.sh ${{ matrix.rid }} "${RAW_VERSION#v}"
      - name: Install libVLC (Linux only; it is not bundled there)
        if: matrix.rid == 'linux-x64'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libvlc5 vlc-plugin-base
      - name: Self-test the packaged app (libVLC decodes a test file, ffmpeg runs)
        shell: bash
        run: |
          case "${{ matrix.rid }}" in
            osx-arm64) D=dist/Cnema.app/Contents/MacOS ;;
            osx-x64)   echo "Intel build: not runnable on an Apple Silicon runner, skipping"; exit 0 ;;
            *)         D=dist/Cnema ;;
          esac
          "$D/tools/ffmpeg" -hide_banner -version | head -1
          "$D/Cnema" --selftest
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: |
            dist/Cnema-*.zip
            dist/Cnema-*.tar.gz
          if-no-files-found: error
