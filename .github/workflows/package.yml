name: Package

# Builds the downloadable archives for every platform. Called by release.yml, and by build.yml on
# pull requests so packaging problems show up before a release is cut.
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: osx-arm64
            os: macos-latest
          - rid: osx-x64
            os: macos-latest
          - rid: win-x64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    env:
      RAW_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Package
        shell: bash
        run: scripts/package.sh ${{ matrix.rid }} "${RAW_VERSION#v}"
      - name: Install libVLC (Linux only; it is not bundled there)
        if: matrix.rid == 'linux-x64'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libvlc5 vlc-plugin-base
      - name: Self-test the packaged app (libVLC decodes a test file, ffmpeg runs)
        shell: bash
        run: |
          case "${{ matrix.rid }}" in
            osx-arm64) D=dist/Cnema.app/Contents/MacOS ;;
            osx-x64)   echo "Intel build: not runnable on an Apple Silicon runner, skipping"; exit 0 ;;
            *)         D=dist/Cnema ;;
          esac
          "$D/tools/ffmpeg" -hide_banner -version | head -1
          "$D/Cnema" --selftest
      # The real start, window and all: the loading screen, a small library, the main window. v0.47.0 passed
      # every self-test above yet its main window failed to open on Apple Silicon.
      - name: Start the real app (loading screen, library, main window)
        if: matrix.rid == 'osx-arm64' || matrix.rid == 'win-x64'
        shell: bash
        timeout-minutes: 6
        run: |
          case "${{ matrix.rid }}" in
            osx-arm64) D=dist/Cnema.app/Contents/MacOS ;;
            *)         D=dist/Cnema ;;
          esac
          clips="$RUNNER_TEMP/clips"; mkdir -p "$clips" "dist/Savefile Data"
          for i in 1 2 3; do
            "$D/tools/ffmpeg" -v error -f lavfi -i testsrc2=size=640x360:rate=30 -f lavfi -i sine=f=440 -t 4 \
              -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest "$clips/clip$i.mp4"
          done
          folder="$clips"; command -v cygpath >/dev/null && folder="$(cygpath -m "$clips")"
          # Install updates automatically is off: a pull request build is version 0.0.0, so it would install the
          # latest release over itself mid-test (and the check below would find no app).
          printf '{"Folders":["%s"],"AutoUpdate":false}' "$folder" > "dist/Savefile Data/settings.json"
          # The update check that runs first at every start still goes to the real release feed, and a start that
          # worked must clear its "start in progress" marker.
          status=0; CNEMA_UPDATE_API=https://api.github.com/repos/TheRoben-Dev/Cnema-releases/releases/latest "$D/Cnema" --selftest-start || status=$?
          [ -f "dist/Savefile Data/start-pending" ] && { echo "The start marker was left behind"; status=1; }
          log="dist/Savefile Data/logs/cnema.log"; [ -f "$log" ] && cat "$log"
          rm -rf "dist/Savefile Data"
          exit $status
      - name: Self-test the smart models (downloads them like the app does, runs each on a test video)
        shell: bash
        timeout-minutes: 20
        run: |
          case "${{ matrix.rid }}" in
            osx-arm64) D=dist/Cnema.app/Contents/MacOS ;;
            osx-x64)   echo "Intel build: not runnable on an Apple Silicon runner, skipping"; exit 0 ;;
            *)         D=dist/Cnema ;;
          esac
          export HOME="$RUNNER_TEMP/home" && mkdir -p "$HOME"
          speech=""
          if [ "$(uname)" = "Darwin" ]; then
            say -o "$RUNNER_TEMP/speech.aiff" "Hello, this is a Savefile test. Testing one, two, three." || true
            [ -s "$RUNNER_TEMP/speech.aiff" ] && speech="$RUNNER_TEMP/speech.aiff"
          fi
          "$D/Cnema" --selftest-models "$speech"
      # Clipping on a real Windows desktop: the rolling capture starts, and when Desktop Duplication fails
      # Savefile switches to GDI capture by itself. Informational: a runner's desktop isn't a gaming PC.
      - name: Self-test clipping (Windows capture and its GDI fallback)
        if: matrix.rid == 'win-x64'
        continue-on-error: true
        shell: bash
        timeout-minutes: 6
        run: |
          dist/Cnema/Cnema --selftest-capture
          dist/Cnema/Cnema --selftest-capture --break-ddagrab
          dist/Cnema/Cnema --selftest-capture --system-audio
      # The Windows installer: the same app folder as the zip, installed for just me or for everyone.
      - name: Build the Windows installer
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $v = $env:RAW_VERSION.TrimStart('v')
          $num = ($v -split '-')[0]
          & $iscc /Q "/DAppVersion=$v" "/DNumVersion=$num" "/DSourceDir=$PWD\dist\Cnema" "/DOutputDir=$PWD\dist" installer\savefile.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item dist\Savefile-*-setup.exe | Format-Table Name, Length
      - name: Test the Windows installer (install, update and uninstall, for just me and for everyone)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        timeout-minutes: 20
        run: installer\test-installer.ps1 (Get-Item dist\Savefile-*-setup.exe).FullName $env:RAW_VERSION.TrimStart('v')
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: |
            dist/Savefile-*.zip
            dist/Savefile-*.tar.gz
            dist/Savefile-*-setup.exe
          if-no-files-found: error
